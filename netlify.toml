# Netlify configuration file for Upcurvv React Project

[build]
  # Path to the directory where package.json and vite.config.js live
  base = "20261015/Task-1-Home-Page-WB"

  # Command to install and build the production bundle
  command = "npm run build"

  # Directory that contains the deploy-ready HTML and assets (relative to base)
  publish = "dist"

# Single Page Application (SPA) redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
